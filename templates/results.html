<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gaming Trends Results</title>

    <!-- If your stylesheet has a different name/path, change it here. -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header>
        <h1>Gaming Trends</h1>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('home') }}#survey">Submit</a>
            <a href="{{ url_for('results_page') }}">Results</a>
        </nav>
    </header>

    <main>
        <h2>Community Results</h2>

        <p>
            <label for="platform-filter">Platform:</label>
            <select id="platform-filter">
                <option value="">All platforms</option>
            </select>
        </p>

        <section class="results-grid">
            <article>
                <h3>Favorite Games</h3>
                <ol id="favorite-results"></ol>
            </article>

            <article>
                <h3>Most-Played Games</h3>
                <ol id="most-played-results"></ol>
            </article>

            <article>
                <h3>Currently Playing</h3>
                <ol id="currently-playing-results"></ol>
            </article>
        </section>
    </main>

    <script>
        const listIds = {
            favorite: "favorite-results",
            most_played: "most-played-results",
            currently_playing: "currently-playing-results"
        };

        const platformFilter = document.getElementById("platform-filter");

        async function loadPlatforms() {
            try {
                const response = await fetch("/api/platforms");
                const platforms = await response.json();

                for (const name of platforms) {
                    const option = document.createElement("option");
                    option.value = name;
                    option.textContent = name;
                    platformFilter.appendChild(option);
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function loadResults() {
            try {
                const params = new URLSearchParams({ limit: 10 });

                if (platformFilter.value) {
                    params.set("platform", platformFilter.value);
                }

                const response = await fetch(
                    "/api/results?" + params.toString()
                );

                if (!response.ok) {
                    throw new Error("Could not load results");
                }

                const data = await response.json();

                for (const category of data.categories) {
                    const list = document.getElementById(
                        listIds[category.category]
                    );

                    list.innerHTML = "";

                    for (const result of category.results) {
                        const item = document.createElement("li");

                        item.textContent =
                            `${result.game} — ${result.votes} votes`;

                        list.appendChild(item);
                    }

                    if (category.results.length === 0) {
                        const item = document.createElement("li");
                        item.textContent = "No responses yet";
                        list.appendChild(item);
                    }
                }

            } catch (error) {
                console.error(error);
            }
        }

        platformFilter.addEventListener("change", loadResults);

        loadPlatforms();
        loadResults();
    </script>
</body>
</html>
